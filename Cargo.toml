[package]
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
categories = ["command-line-utilities", "text-processing"]
description = "SIMD-accelerated command-line text processing utilities built on StringZilla"
edition = "2021"
keywords = ["cli", "text-processing", "simd", "performance"]
license = "Apache-2.0"
name = "stringzilla-cli"
readme = "README.md"
repository = "https://github.com/ashvardanian/StringZilla-CLI"
version = "0.1.0"

[features]
cuda = ["stringzilla/cuda"] # CUDA backend for sz-fuzzy-find (build with --features cuda)
default = []

[dependencies]
clap = {version = "4.5", features = ["derive"]}# CLI argument parsing 
glob = "0.3" # Glob pattern matching
ignore = "0.4" # .gitignore support
memmap2 = "0.9" # Memory-mapped file I/O
stringzilla = {version = "4", features = ["cpus"]}# SIMD string ops + szs multicore kernels 
walkdir = "2.4" # Directory traversal

[dev-dependencies]
tempfile = "3.10"

[profile.release]
codegen-units = 1 # Better optimization, slower compile
lto = true # Link-time optimization
opt-level = 3 # Maximum optimization
strip = true # Strip symbols for smaller binary

[[bin]]
name = "sz-count"
path = "sz_count.rs"

[[bin]]
name = "sz-split"
path = "sz_split.rs"

[[bin]]
name = "sz-dedup"
path = "sz_dedup.rs"

[[bin]]
name = "sz-find"
path = "sz_find.rs"

[[bin]]
name = "sz-replace"
path = "sz_replace.rs"

[[bin]]
name = "sz-cols"
path = "sz_cols.rs"

[[bin]]
name = "sz-rows"
path = "sz_rows.rs"

[[bin]]
name = "sz-outline"
path = "sz_outline.rs"

[[bin]]
name = "sz-sort"
path = "sz_sort.rs"

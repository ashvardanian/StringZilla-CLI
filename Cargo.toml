[package]
name = "sz-cli"
version = "0.1.0"
edition = "2021"
authors = ["Ash Vardanian <1983160+ashvardanian@users.noreply.github.com>"]
description = "SIMD-accelerated command-line text processing utilities built on StringZilla"
readme = "README.md"
license = "Apache-2.0"
keywords = ["cli", "text-processing", "simd", "performance"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/ashvardanian/StringZillaCLI"

[dependencies]
clap = { version = "4.5", features = ["derive"] } # CLI argument parsing
memmap2 = "0.9"                                   # Memory-mapped file I/O
stringzilla = { path = "../StringZilla" }         # SIMD-accelerated string operations
walkdir = "2.4"                                   # Directory traversal
ignore = "0.4"                                    # .gitignore support

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
lto = true        # Link-time optimization
codegen-units = 1 # Better optimization, slower compile
opt-level = 3     # Maximum optimization
strip = true      # Strip symbols for smaller binary

[[bin]]
name = "sz-count"
path = "sz_count.rs"

[[bin]]
name = "sz-split"
path = "sz_split.rs"

[[bin]]
name = "sz-dedup"
path = "sz_dedup.rs"

[[bin]]
name = "sz-find"
path = "sz_find.rs"

[[bin]]
name = "sz-replace"
path = "sz_replace.rs"

[[bin]]
name = "sz-cols"
path = "sz_cols.rs"

[[bin]]
name = "sz-rows"
path = "sz_rows.rs"

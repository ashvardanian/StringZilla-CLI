name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Test the opt-in tools
        run: |
          cargo test --release --features outline
          cargo test --release --features fuzzy-find

  # Downstream of tests, so a release never carries binaries from a red build.
  build_binaries:
    name: Build Binaries
    needs: [hooks, test]
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: ${{ github.sha }}
      upload: true

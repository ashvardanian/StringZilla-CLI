name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Test the opt-in tools
        run: |
          cargo test --release --features outline
          cargo test --release --features fuzzy-find

  # Downstream of tests, so a release is never cut from a red build.
  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            Cargo.toml:^version = "(\d+\.\d+\.\d+)"
            Cargo.lock:name = "stringzilla-cli"\nversion = "(\d+\.\d+\.\d+)"
            README.md:--tag v(\d+\.\d+\.\d+)
            README.md:stringzilla-cli-v(\d+\.\d+\.\d+)-
            README.md:stringzilla-cli_(\d+\.\d+\.\d+)_amd64
            README.md:releases/download/v(\d+\.\d+\.\d+)/
            .claude-plugin/marketplace.json:"version": "(\d+\.\d+\.\d+)"
            .codex-plugin/plugin.json:"version": "(\d+\.\d+\.\d+)"
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # `ref: main` is load-bearing: `versioning` has pushed the bumped VERSION and the tag,
  # while this workflow's own SHA still points at the pre-bump commit, so building the
  # trigger SHA would name every archive after the previous release.
  build_binaries:
    name: Build Binaries
    needs: [versioning]
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: "main"
      upload: true
